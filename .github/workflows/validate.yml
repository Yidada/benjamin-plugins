name: Validate plugins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate marketplace and skills
        run: python scripts/validate.py
      - name: Test SDLC CLI
        run: python plugins/ai-native-sdlc/skills/ai-native-sdlc/scripts/test_sdlc.py
      - name: Test LoopX preflight
        run: python plugins/loopx/skills/loopx/scripts/test_preflight.py
